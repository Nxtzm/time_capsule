<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Love Time Capsule ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts"></div>

  <header>
    <h1>❤️ Our Love Time Capsule ❤️</h1>
    <p>Write memories today. Unlock them in the future.</p>
  </header>

  <main>
    <section class="lock-screen" id="lockScreen">
      <h2>Enter Your Secret PIN</h2>
      <input type="password" id="pinInput" placeholder="Enter PIN">
      <button onclick="unlockCapsule()">Unlock</button>
    </section>

    <section class="capsule hidden" id="capsuleSection">
      <div class="create-note">
        <h2>Create a New Capsule</h2>
        <input type="text" id="title" placeholder="Memory title...">
        <textarea id="message" placeholder="Write your love note..."></textarea>
        <input type="date" id="unlockDate">
        <button onclick="saveCapsule()">Lock Memory ❤️</button>
      </div>

      <div class="capsules-list">
        <h2>Our Locked Memories</h2>
        <div id="capsulesContainer"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
